# DNS for the lab (UDP demonstration service). Listens on the appnet-facing side only.
no-resolv
no-hosts
log-queries
# Interface order in the netns is not deterministic (Docker assigns eth0/eth1
# by its own attach order), so bind by address instead: the appnet side.
listen-address=172.28.10.254
except-interface=lo
bind-interfaces
# .local is reserved for Multicast DNS (RFC 6762) and .internal is the
# TLD reserved for private-use namespaces, so the lab zone is <host>.lab.internal.
# local= makes the resolver authoritative for the whole zone: known names
# answer from the address= records, unknown names get NXDOMAIN, and anything
# outside the zone is REFUSED (no upstream resolvers are configured).
local=/lab.internal/
address=/kanboard.lab.internal/172.28.10.10
address=/mariadb.lab.internal/172.28.20.10
